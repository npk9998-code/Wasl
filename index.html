<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العروض العقارية - الموظف</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { font-size: 24px; color: var(--primary); }
        .stats { display: flex; gap: 15px; background: var(--bg-card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; }
        .stat-item { flex: 1; text-align: center; }
        .stat-item span { display: block; font-size: 14px; color: var(--text-muted); }
        .stat-item strong { font-size: 20px; color: var(--primary); }
        .form-section { background-color: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1xl)); gap: 15px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 14px; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; background: var(--bg-card); padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
        .offers-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .offer-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .offer-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .property-type { background: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .price { color: var(--success); font-weight: bold; }
        .details-row { margin-bottom: 8px; font-size: 14px; }
        .details-row span { color: var(--text-muted); }
        .actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px; }
        .btn-delete { background: var(--danger); width: 100%; }
        .btn-delete:hover { background: #dc2626; }
        .link-btn { background: #475569; text-decoration: none; color: white; padding: 10px; border-radius: 6px; font-size: 14px; text-align: center; }
        .link-btn:hover { background: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>لوحة تحكم العروض العقارية 🏢</h1>
            <a href="client.html" class="link-btn" target="_blank">شاشة عرض المشترين 🔗</a>
        </header>

        <div class="stats">
            <div class="stat-item"><span>إجمالي العروض</span><strong id="total-count">0</strong></div>
            <div class="stat-item"><span>شقق</span><strong id="apt-count">0</strong></div>
            <div class="stat-item"><span>فلل</span><strong id="villa-count">0</strong></div>
            <div class="stat-item"><span>أراضي</span><strong id="land-count">0</strong></div>
        </div>

        <div class="form-section">
            <h3 style="margin-bottom: 15px;">إضافة عرض عقاري جديد</h3>
            <form id="offer-form">
                <div class="form-grid">
                    <select id="type" required>
                        <option value="">نوع العقار</option>
                        <option value="شقة">شقة</option>
                        <option value="فيلا">فيلا</option>
                        <option value="أرض">أرض</option>
                        <option value="دور">دور</option>
                        <option value="عميرة">عميرة</option>
                    </select>
                    <input type="text" id="city" placeholder="المدينة (مثال: الرياض)" required>
                    <input type="text" id="district" placeholder="الحي" required>
                    <input type="number" id="price" placeholder="السعر (SAR)" required>
                    <input type="number" id="space" placeholder="المساحة (متر مربع)" required>
                    <input type="text" id="advertiser" placeholder="اسم المعلن/المالك" required>
                    <input type="tel" id="phone" placeholder="رقم الجوال" required>
                </div>
                <textarea id="notes" rows="3" placeholder="ملاحظات إضافية أو وصف للعقار..."></textarea>
                <button type="submit" style="margin-top: 15px; width: 100%;">حفظ العرض ونشره سحابياً 🚀</button>
            </form>
        </div>

        <div class="filters">
            <select id="filter-city" onchange="fetchOffers()">
                <option value="">كل المدن</option>
            </select>
            <select id="filter-type" onchange="fetchOffers()">
                <option value="">كل الأنواع</option>
                <option value="شقة">شقة</option>
                <option value="فيلا">فيلا</option>
                <option value="أرض">أرض</option>
            </select>
        </div>

        <div class="offers-list" id="offers-container">
            </div>
    </div>

    <script>
        // دمج بيانات الاتصال بـ Supabase
        const SUPABASE_URL = "https://jqirtyjhkfivufleteek.supabase.co"; 
        const SUPABASE_ANON_KEY = "ضع_هنا_مفتاح_ANON_الخاص_بمشروعك"; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('offer-form');

        // جلب العروض من قاعدة البيانات وتحديث الشاشة
        async function fetchOffers() {
            const cityFilter = document.getElementById('filter-city').value;
            const typeFilter = document.getElementById('filter-type').value;

            let query = supabase.from('offers').select('*').order('created_at', { ascending: false });

            if (cityFilter) query = query.eq('city', cityFilter);
            if (typeFilter) query = query.eq('type', typeFilter);

            const { data: offers, error } = await query;

            if (error) {
                console.error("خطأ في جلب البيانات:", error);
                return;
            }

            renderOffers(offers);
            updateStats(offers);
            populateCityFilter(offers);
        }

        function renderOffers(offers) {
            const container = document.getElementById('offers-container');
            container.innerHTML = '';

            if (offers.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">لا توجد عروض متوفرة حالياً.</p>`;
                return;
            }

            offers.forEach(offer => {
                const card = document.createElement('div');
                card.className = 'offer-card';
                card.innerHTML = `
                    <div>
                        <div class="offer-header">
                            <span class="property-type">${offer.type}</span>
                            <span class="price">${Number(offer.price).toLocaleString()} SAR</span>
                        </div>
                        <div class="details-row"><span>الموقع:</span> ${offer.city}، حي ${offer.district}</div>
                        <div class="details-row"><span>المساحة:</span> ${offer.space} م²</div>
                        <div class="details-row"><span>المعلن:</span> ${offer.advertiser}</div>
                        <div class="details-row"><span>الجوال:</span> <a href="tel:${offer.phone}" style="color: var(--primary); text-decoration:none;">${offer.phone}</a></div>
                        ${offer.notes ? `<div class="details-row" style="margin-top:10px; background:#0f172a; padding:5px; border-radius:4px;"><span>وصف:</span> ${offer.notes}</div>` : ''}
                    </div>
                    <div class="actions">
                        <button class="btn-delete" onclick="deleteOffer(${offer.id})">حذف العرض</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // إضافة عرض جديد إلى الـ Supabase
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newOffer = {
                type: document.getElementById('type').value,
                city: document.getElementById('city').value.trim(),
                district: document.getElementById('district').value.trim(),
                price: parseFloat(document.getElementById('price').value),
                space: parseFloat(document.getElementById('space').value),
                advertiser: document.getElementById('advertiser').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                notes: document.getElementById('notes').value.trim()
            };

            const { error } = await supabase.from('offers').insert([newOffer]);

            if (error) {
                alert("حدث خطأ أثناء الحفظ: " + error.message);
            } else {
                form.reset();
                fetchOffers();
            }
        });

        // حذف عرض
        async function deleteOffer(id) {
            if (confirm("هل أنت متأكد من حذف هذا العرض نهائياً؟")) {
                const { error } = await supabase.from('offers').delete().eq('id', id);
                if (error) {
                    alert("فشل الحذف: " + error.message);
                } else {
                    fetchOffers();
                }
            }
        }

        // تحديث العدادات والإحصائيات
        function updateStats(offers) {
            document.getElementById('total-count').innerText = offers.length;
            document.getElementById('apt-count').innerText = offers.filter(o => o.type === 'شقة').length;
            document.getElementById('villa-count').innerText = offers.filter(o => o.type === 'فيلا').length;
            document.getElementById('land-count').innerText = offers.filter(o => o.type === 'أرض').length;
        }

        // تعبئة قائمة تصفية المدن ديناميكياً
        function populateCityFilter(offers) {
            const filterCity = document.getElementById('filter-city');
            const currentSelection = filterCity.value;
            const cities = [...new Set(offers.map(o => o.city))];
            
            filterCity.innerHTML = '<option value="">كل المدن</option>';
            cities.forEach(city => {
                if(city) {
                    const opt = document.createElement('option');
                    opt.value = city;
                    opt.innerText = city;
                    filterCity.appendChild(opt);
                }
            });
            filterCity.value = currentSelection;
        }

        // تشغيل الجلب التلقائي عند فتح الصفحة
        window.onload = fetchOffers;
    </script>
</body>
</html>

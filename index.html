<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدير العروض والمطابقات العقارية الذكي</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<style>
  .stats-row{display:flex;gap:10px;padding:6px 16px 0;overflow-x:auto;}
  .stat-pill{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:10px 16px;min-width:100px;text-align:center;flex-shrink:0;
  }
  .stat-pill b{display:block;font-size:18px;color:var(--accent);}
  .stat-pill span{font-size:11.5px;color:var(--text-dim);}
</style>
</head>
<body data-mode="seller">

<div class="topbar">
  <div class="brand"><span class="dot"></span> مدير العروض العقارية</div>
  <div class="toggle-wrap">
    <button id="btnSellerTab" class="active" onclick="switchSection('seller')">البائعين</button>
    <button id="btnBuyerTab" onclick="switchSection('buyer')">المشترين</button>
  </div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="search-row">
  <input type="text" id="searchInput" placeholder="بحث بالحي، المدينة، نوع العقار...">
  <button class="fav-toggle" id="favToggle" title="المفضلة">⭐</button>
</div>

<div class="grid" id="cardsGrid"></div>

<div class="overlay" id="overlay" onclick="closeSheetOnBg(event)">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<div class="bottomnav">
  <a href="index.html" class="active">🏠<span>الرئيسية</span></a>
  <a href="matching.html">🎯<span>المطابقة</span></a>
  <a href="client.html">➕<span>طلب جديد</span></a>
</div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let section = "seller"; // seller | buyer
let allData = { sellers: [], buyers: [] };
let showFavOnly = false;

async function init(){
  allData = await CloudStore.load();
  render();
  setInterval(refreshSilently, 20000);
}

async function refreshSilently(){
  allData = await CloudStore.load();
  render();
}

function switchSection(s){
  section = s;
  document.body.setAttribute("data-mode", s === "buyer" ? "buyer" : "seller");
  document.getElementById("btnSellerTab").classList.toggle("active", s==="seller");
  document.getElementById("btnBuyerTab").classList.toggle("active", s==="buyer");
  render();
}

function currentList(){
  const list = section === "seller" ? allData.sellers : allData.buyers;
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  return list.filter(item => {
    if (showFavOnly && !Favorites.isFav(item.id)) return false;
    if (!q) return true;
    const hay = [
      item.city, item.propertyType, item.neighborhood,
      (item.neighborhoods||[]).join(" "), item.clientName
    ].join(" ").toLowerCase();
    return hay.includes(q);
  }).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
}

function renderStats(){
  const s = allData.sellers.length, b = allData.buyers.length;
  const newS = allData.sellers.filter(x=>!x.isRead).length;
  const newB = allData.buyers.filter(x=>!x.isRead).length;
  document.getElementById("statsRow").innerHTML = `
    <div class="stat-pill"><b>${s}</b><span>عروض بائعين</span></div>
    <div class="stat-pill"><b>${b}</b><span>طلبات مشترين</span></div>
    <div class="stat-pill"><b>${section==='seller'?newS:newB}</b><span>جديد غير مقروء</span></div>
  `;
}

function cardHtml(item){
  const isFav = Favorites.isFav(item.id);
  if (section === "seller") {
    return `
      <div class="card" onclick="openSheet('${item.id}')">
        ${!item.isRead ? '<span class="badge-new">جديد</span>' : ''}
        <button class="fav-star ${isFav?'active':''}" onclick="event.stopPropagation(); toggleFav('${item.id}')">★</button>
        <div class="card-top">
          <div>
            <p class="card-title">${item.propertyType} - ${item.city}</p>
            <p class="card-sub">${item.neighborhood || ""}</p>
          </div>
          <div class="card-price">${formatNumberDisplay(item.price)} ﷼</div>
        </div>
        <div class="card-meta">
          ${item.direction ? `<span class="chip">${item.direction}</span>`:""}
          ${item.area ? `<span class="chip">${formatNumberDisplay(item.area)} م²</span>`:""}
          ${item.negotiable ? `<span class="chip">قابل للتفاوض</span>`:""}
        </div>
      </div>`;
  } else {
    return `
      <div class="card" onclick="openSheet('${item.id}')">
        ${!item.isRead ? '<span class="badge-new">جديد</span>' : ''}
        <button class="fav-star ${isFav?'active':''}" onclick="event.stopPropagation(); toggleFav('${item.id}')">★</button>
        <div class="card-top">
          <div>
            <p class="card-title">${item.propertyType} - ${item.city}</p>
            <p class="card-sub">${(item.neighborhoods||[]).join("، ")}</p>
          </div>
          <div class="card-price">${formatNumberDisplay(item.budgetFrom)} - ${formatNumberDisplay(item.budgetTo)}</div>
        </div>
        <div class="card-meta">
          ${item.areaFrom ? `<span class="chip">${formatNumberDisplay(item.areaFrom)}-${formatNumberDisplay(item.areaTo)} م²</span>`:""}
        </div>
      </div>`;
  }
}

function render(){
  renderStats();
  const list = currentList();
  const grid = document.getElementById("cardsGrid");
  grid.innerHTML = list.length ? list.map(cardHtml).join("") :
    `<div class="empty-state">لا توجد عناصر مطابقة حالياً</div>`;
}

function toggleFav(id){
  Favorites.toggle(id);
  render();
}

document.getElementById("favToggle").addEventListener("click", ()=>{
  showFavOnly = !showFavOnly;
  document.getElementById("favToggle").classList.toggle("active", showFavOnly);
  render();
});
document.getElementById("searchInput").addEventListener("input", render);

function findItem(id){
  return (section === "seller" ? allData.sellers : allData.buyers).find(x=>x.id===id);
}

async function openSheet(id){
  const item = findItem(id);
  if (!item) return;
  if (!item.isRead) {
    item.isRead = true;
    await CloudStore.save(allData);
  }
  const isFav = Favorites.isFav(id);
  const msg = buildShareMessage(item, section);
  let rows = "";
  if (section === "seller") {
    rows = `
      <div class="sheet-row"><span>المدينة</span><span>${item.city}</span></div>
      <div class="sheet-row"><span>الحي</span><span>${item.neighborhood||"—"}</span></div>
      <div class="sheet-row"><span>نوع العقار</span><span>${item.propertyType}</span></div>
      <div class="sheet-row"><span>الاتجاه</span><span>${item.direction||"—"}</span></div>
      <div class="sheet-row"><span>المساحة</span><span>${formatNumberDisplay(item.area)} م²</span></div>
      <div class="sheet-row"><span>السعر</span><span>${formatNumberDisplay(item.price)} ﷼ ${item.negotiable?'(قابل للتفاوض)':''}</span></div>
    `;
  } else {
    rows = `
      <div class="sheet-row"><span>المدينة</span><span>${item.city}</span></div>
      <div class="sheet-row"><span>الأحياء المطلوبة</span><span>${(item.neighborhoods||[]).join("، ")||"—"}</span></div>
      <div class="sheet-row"><span>نوع العقار</span><span>${item.propertyType}</span></div>
      <div class="sheet-row"><span>المساحة المطلوبة</span><span>${formatNumberDisplay(item.areaFrom)} - ${formatNumberDisplay(item.areaTo)} م²</span></div>
      <div class="sheet-row"><span>الميزانية</span><span>${formatNumberDisplay(item.budgetFrom)} - ${formatNumberDisplay(item.budgetTo)} ﷼</span></div>
    `;
  }
  document.getElementById("sheet").innerHTML = `
    <div class="sheet-handle"></div>
    <h2 style="margin:0 0 4px;">${item.clientName}</h2>
    <p style="color:var(--text-dim);margin:0 0 14px;">${item.phone}</p>
    ${rows}
    ${item.notes ? `<div class="sheet-row" style="display:block;"><span>ملاحظات</span><p style="margin:6px 0 0;color:var(--text);">${item.notes}</p></div>` : ""}
    <div class="sheet-actions">
      <button class="btn btn-call" onclick="location.href='${telUrl(item.phone)}'">📞 اتصال</button>
      <button class="btn btn-whatsapp" onclick="window.open('${whatsappChatUrl(item.phone)}','_blank')">💬 واتساب</button>
      <button class="btn btn-share" onclick="window.open('${whatsappChatUrl('', '').split('?')[0]}?text=${encodeURIComponent(msg)}','_blank')">📤 مشاركة العرض</button>
      <button class="btn ${isFav?'btn-accent':'btn-ghost'}" onclick="toggleFav('${item.id}'); closeSheet();">⭐ ${isFav?'إزالة من المفضلة':'إضافة للمفضلة'}</button>
    </div>
  `;
  document.getElementById("overlay").classList.add("show");
}

function closeSheet(){ document.getElementById("overlay").classList.remove("show"); render(); }
function closeSheetOnBg(e){ if (e.target.id === "overlay") closeSheet(); }

init();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>

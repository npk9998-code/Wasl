<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروض العقارية المتاحة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #10b981; /* لون أخضر مريح للمشترين */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 26px; color: var(--primary); margin-bottom: 5px; }
        .search-box { background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select { width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        .offers-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .offer-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .offer-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .offer-header { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .property-type { background: #3b82f6; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .price { color: var(--primary); font-weight: bold; font-size: 18px; }
        .details-row { margin-bottom: 8px; font-size: 14px; }
        .details-row span { color: var(--text-muted); }
        .btn-contact { display: block; width: 100%; text-align: center; background: var(--primary); color: white; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        .btn-contact:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>منصة العروض العقارية المباشرة 🏡</h1>
            <p style="color: var(--text-muted);">ابحث عن عقارك المناسب بين مئات العروض المحدثة فورياً</p>
        </header>

        <div class="search-box">
            <div class="search-grid">
                <input type="text" id="search-district" placeholder="ابحث باسم الحي..." oninput="fetchOffers()">
                <select id="search-type" onchange="fetchOffers()">
                    <option value="">كل الأنواع</option>
                    <option value="شقة">شقة</option>
                    <option value="فيلا">فيلا</option>
                    <option value="أرض">أرض</option>
                    <option value="دور">دور</option>
                </select>
                <input type="number" id="search-max-price" placeholder="الحد الأقصى للسعر (SAR)" oninput="fetchOffers()">
                <input type="number" id="search-min-space" placeholder="الحد الأدنى للمساحة م²" oninput="fetchOffers()">
            </div>
        </div>

        <div class="offers-list" id="client-offers-container">
            </div>
    </div>

    <script>
        // دمج بيانات الاتصال بـ Supabase
        const SUPABASE_URL = "https://jqirtyjhkfivufleteek.supabase.co"; 
        const SUPABASE_ANON_KEY = "ضع_هنا_مفتاح_ANON_الخاص_بمشروعك"; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // جلب البيانات مع تطبيق فلاتر البحث المتقدمة للمشتري
        async function fetchOffers() {
            const district = document.getElementById('search-district').value.trim();
            const type = document.getElementById('search-type').value;
            const maxPrice = document.getElementById('search-max-price').value;
            const minSpace = document.getElementById('search-min-space').value;

            let query = supabase.from('offers').select('*').order('created_at', { ascending: false });

            if (district) query = query.ilike('district', `%${district}%`);
            if (type) query = query.eq('type', type);
            if (maxPrice) query = query.lte('price', parseFloat(maxPrice));
            if (minSpace) query = query.gte('space', parseFloat(minSpace));

            const { data: offers, error } = await query;

            if (error) {
                console.error("خطأ أثناء جلب العروض:", error);
                return;
            }

            renderOffers(offers);
        }

        function renderOffers(offers) {
            const container = document.getElementById('client-offers-container');
            container.innerHTML = '';

            if (offers.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">لا توجد عروض تطابق خيارات البحث الحالية.</p>`;
                return;
            }

            offers.forEach(offer => {
                const card = document.createElement('div');
                card.className = 'offer-card';
                card.innerHTML = `
                    <div>
                        <div class="offer-header">
                            <span class="property-type">${offer.type}</span>
                            <span class="price">${Number(offer.price).toLocaleString()} SAR</span>
                        </div>
                        <div class="details-row"><span>المدينة:</span> ${offer.city}</div>
                        <div class="details-row"><span>الحي:</span> حي ${offer.district}</div>
                        <div class="details-row"><span>المساحة:</span> ${offer.space} متر مربع</div>
                        ${offer.notes ? `<div class="details-row" style="margin-top:10px; background:#0f172a; padding:8px; border-radius:4px; font-size:13px; color:#cbd5e1;"><span>تفاصيل إضافية:</span> ${offer.notes}</div>` : ''}
                    </div>
                    <a href="https://wa.me/${offer.phone.replace(/[^0-9]/g, '')}" class="btn-contact" target="_blank">تواصل عبر الواتساب للاستفسار 💬</a>
                `;
                container.appendChild(card);
            });
        }

        // تحميل البيانات عند فتح الصفحة أول مرة
        window.onload = fetchOffers;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل طلب عقاري</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<style>
  .form-wrap{padding-top:30px;}
  .page-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px;}
  .page-sub{text-align:center;color:var(--text-dim);font-size:13.5px;margin-bottom:24px;}
  .submit-btn{width:100%;padding:16px;font-size:16px;border-radius:14px;margin-top:8px;}
  .success-box{
    text-align:center;padding:50px 20px;
  }
  .success-box .icon{font-size:54px;margin-bottom:10px;}
</style>
</head>
<body data-mode="seller">

<div class="form-wrap">
  <div id="formArea">
    <h1 class="page-title">📋 تسجيل طلبك العقاري</h1>
    <p class="page-sub">اختر نوع طلبك وعبّئ البيانات بدقة ليتم التواصل معك بأفضل العروض المطابقة</p>

    <div class="type-switch">
      <button id="btnSeller" class="active" onclick="setMode('seller')">🏷️ بائع</button>
      <button id="btnBuyer" onclick="setMode('buyer')">🔍 مشتري</button>
    </div>

    <form id="reForm">
      <div class="field">
        <label>اسم العميل</label>
        <input type="text" id="clientName" required>
      </div>
      <div class="field">
        <label>رقم الجوال (واتساب)</label>
        <input type="tel" id="phone" data-phone required placeholder="05xxxxxxxx">
      </div>
      <div class="field">
        <label>المدينة</label>
        <select id="city" required></select>
      </div>
      <div class="field">
        <label id="neighLabel">الحي</label>
        <input type="text" id="neighborhood" placeholder="اسم الحي">
      </div>
      <div class="field">
        <label>نوع العقار</label>
        <select id="propertyType" required></select>
      </div>

      <!-- حقول البائع -->
      <div id="sellerFields">
        <div class="field">
          <label>الاتجاه</label>
          <select id="direction"></select>
        </div>
        <div class="field">
          <label>المساحة (م²)</label>
          <input type="text" id="area" data-numeric inputmode="numeric">
        </div>
        <div class="field">
          <label>السعر (ريال)</label>
          <input type="text" id="price" data-numeric inputmode="numeric" required>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:10px;">
          <input type="checkbox" id="negotiable" style="width:auto;">
          <label style="margin:0;" for="negotiable">السعر قابل للتفاوض</label>
        </div>
      </div>

      <!-- حقول المشتري -->
      <div id="buyerFields" style="display:none;">
        <div class="field">
          <label>نطاق الميزانية (ريال)</label>
          <div class="range-row">
            <div class="field"><input type="text" id="budgetFrom" data-numeric inputmode="numeric" placeholder="من"></div>
            <div class="field"><input type="text" id="budgetTo" data-numeric inputmode="numeric" placeholder="إلى"></div>
          </div>
        </div>
        <div class="field">
          <label>نطاق المساحة المطلوبة (م²)</label>
          <div class="range-row">
            <div class="field"><input type="text" id="areaFrom" data-numeric inputmode="numeric" placeholder="من"></div>
            <div class="field"><input type="text" id="areaTo" data-numeric inputmode="numeric" placeholder="إلى"></div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>ملاحظات إضافية (اختياري)</label>
        <textarea id="notes" placeholder="أي شروط أو تفاصيل إضافية..."></textarea>
      </div>

      <button type="submit" class="btn btn-accent submit-btn">إرسال الطلب</button>
    </form>
  </div>

  <div id="successArea" class="success-box" style="display:none;">
    <div class="icon">✅</div>
    <h2>تم إرسال طلبك بنجاح</h2>
    <p style="color:var(--text-dim);">سيتم التواصل معك بأقرب العروض المطابقة بإذن الله</p>
    <button class="btn btn-ghost" style="margin-top:18px;" onclick="resetForm()">إرسال طلب آخر</button>
  </div>
</div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let currentMode = "seller";

function fillSelect(id, options, placeholder){
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="">${placeholder}</option>` + options.map(o=>`<option value="${o}">${o}</option>`).join("");
}
fillSelect("city", SAUDI_CITIES, "اختر المدينة");
fillSelect("propertyType", PROPERTY_TYPES, "اختر نوع العقار");
fillSelect("direction", DIRECTIONS, "اختر الاتجاه");

function setMode(mode){
  currentMode = mode;
  document.body.setAttribute("data-mode", mode === "buyer" ? "buyer" : "seller");
  document.getElementById("btnSeller").classList.toggle("active", mode==="seller");
  document.getElementById("btnBuyer").classList.toggle("active", mode==="buyer");
  document.getElementById("sellerFields").style.display = mode==="seller" ? "block" : "none";
  document.getElementById("buyerFields").style.display = mode==="buyer" ? "block" : "none";
  document.getElementById("neighLabel").textContent = mode==="seller" ? "الحي" : "الأحياء المرغوبة (افصل بفاصلة)";
  document.getElementById("price").required = mode === "seller";
}

attachNumericBehavior(document);

document.getElementById("reForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const base = {
    id: generateId(),
    clientName: document.getElementById("clientName").value.trim(),
    phone: convertArabicDigits(document.getElementById("phone").value).trim(),
    city: document.getElementById("city").value,
    propertyType: document.getElementById("propertyType").value,
    notes: document.getElementById("notes").value.trim(),
    isRead: false,
    createdAt: new Date().toISOString()
  };

  const data = await CloudStore.load();

  if (currentMode === "seller") {
    base.neighborhood = document.getElementById("neighborhood").value.trim();
    base.direction = document.getElementById("direction").value;
    base.area = getRawValue(document.getElementById("area"));
    base.price = getRawValue(document.getElementById("price"));
    base.negotiable = document.getElementById("negotiable").checked;
    data.sellers.push(base);
  } else {
    base.neighborhoods = document.getElementById("neighborhood").value
      .split(/[,،]/).map(s=>s.trim()).filter(Boolean);
    base.budgetFrom = getRawValue(document.getElementById("budgetFrom"));
    base.budgetTo = getRawValue(document.getElementById("budgetTo"));
    base.areaFrom = getRawValue(document.getElementById("areaFrom"));
    base.areaTo = getRawValue(document.getElementById("areaTo"));
    data.buyers.push(base);
  }

  await CloudStore.save(data);
  document.getElementById("formArea").style.display = "none";
  document.getElementById("successArea").style.display = "block";
});

function resetForm(){
  document.getElementById("reForm").reset();
  document.getElementById("formArea").style.display = "block";
  document.getElementById("successArea").style.display = "none";
  setMode("seller");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
